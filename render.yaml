# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# ANTHROPIC_API_KEY is deliberately NOT in this file. `sync: false` makes Render
# prompt for it in the dashboard, so the key is entered there and never committed.
services:
  - type: web
    name: property-management-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Closest edge to Australian users, who are the ones uploading 5 MB photos.
    # The US-hosted Anthropic API is a little further away, but that leg is
    # noise next to a call that runs for seconds to minutes.
    # Render cannot change this after the service is created; the default is oregon.
    region: singapore
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
